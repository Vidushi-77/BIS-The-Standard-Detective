<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cases | BIS: The Standard Detective</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #dff4ff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           MAIN IMAGE AREA
        ========================= */

        .website {
            position: relative;

            width: 100%;
            max-width: 1536px;

            margin: auto;
        }


        .main-image {
            display: block;

            width: 100%;
            height: auto;

            user-select: none;

            animation:
                gentleZoom
                8s
                ease-in-out
                infinite
                alternate;
        }


        /* =========================
           TOP NAVIGATION
        ========================= */

        .top-navigation {

            position: absolute;

            /*
               Moved upward and toward
               the BIS logo
            */
            top: 4.2%;

            left: 36%;

            z-index: 100;

            display: flex;

            /*
               More space between buttons
            */
            gap: 24px;

            align-items: center;
        }


        /* =========================
           EACH NAVIGATION ITEM
        ========================= */

        .top-navigation-item {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 5px;
        }


        /* =========================
           NAVIGATION BUTTON
        ========================= */

        .top-navigation-item button {

            background: #1e3a8a;

            color: white;

            border: none;

            border-radius: 22px;

            padding: 8px 20px;

            /*
               Rounded/friendly font
               similar to the image
            */
            font-family:
                "Trebuchet MS",
                "Arial Rounded MT Bold",
                Arial,
                sans-serif;

            font-size:
                clamp(12px, 1.15vw, 18px);

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            white-space: nowrap;

            box-shadow:
                0 4px 10px
                rgba(20, 50, 100, 0.25);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =========================
           BUTTON HOVER
        ========================= */

        .top-navigation-item button:hover {

            background: #2854b5;

            transform:
                translateY(-3px);

            box-shadow:
                0 7px 15px
                rgba(20, 50, 100, 0.30);
        }


        /*
           Hidden duplicate text from
           the suggested block
        */

        .top-navigation-item span {

            display: none;
        }


        /* =========================
           EXPLORE BUTTONS
        ========================= */

        .explore-link {

            position: absolute;

            z-index: 20;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            width: 16%;

            height: 6.5%;

            border-radius: 40px;

            text-decoration: none;

            color: #17427f;

            font-size:
                clamp(12px, 1.3vw, 20px);

            font-weight: bold;

            background:
                linear-gradient(
                    180deg,
                    #ffd94a,
                    #ffc928
                );

            box-shadow:
                0 4px 0 #dda817,
                0 7px 16px
                rgba(80, 100, 120, 0.18);

            animation:
                buttonFloat
                2.5s
                ease-in-out
                infinite;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .case-one-button {
            left: 8.5%;
            top: 70%;
            animation-delay: 0s;
        }


        .case-two-button {
            left: 30.2%;
            top: 70%;
            animation-delay: 0.35s;
        }


        .case-three-button {
            left: 52%;
            top: 70%;
            animation-delay: 0.7s;
        }


        .case-four-button {
            left: 73.7%;
            top: 70%;
            animation-delay: 1.05s;
        }


        /* =========================
           EXPLORE HOVER
        ========================= */

        .explore-link:hover {

            animation-play-state: paused;

            transform:
                translateY(-5px)
                scale(1.04);

            box-shadow:
                0 7px 0 #dda817,
                0 12px 22px
                rgba(50, 90, 120, 0.23);
        }


        .explore-link span {

            transition:
                transform 0.25s ease;
        }


        .explore-link:hover span {

            transform:
                translateX(4px);
        }


        .explore-link:active {

            animation-play-state: paused;

            transform:
                translateY(2px)
                scale(0.98);

            box-shadow:
                0 2px 0 #dda817;
        }


        /* =========================
           FLOATING STARS
        ========================= */

        .floating-star {

            position: absolute;

            z-index: 10;

            color: #f5b51b;

            font-size: 24px;

            pointer-events: none;

            animation:
                sparkle
                2s
                ease-in-out
                infinite
                alternate;
        }


        .star-one {
            left: 18%;
            top: 32%;
        }


        .star-two {
            left: 48%;
            top: 39%;

            animation-delay: 0.6s;
        }


        .star-three {
            left: 78%;
            top: 30%;

            animation-delay: 1.1s;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes gentleZoom {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.015);
            }

        }


        @keyframes sparkle {

            from {

                opacity: 0.35;

                transform:
                    scale(0.8)
                    rotate(0deg);
            }

            to {

                opacity: 1;

                transform:
                    scale(1.2)
                    rotate(12deg);
            }

        }


        @keyframes buttonFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .top-navigation {

                top: 4.2%;

                left: 31%;

                gap: 7px;
            }


            .top-navigation-item button {

                font-size: 8px;

                padding: 5px 8px;
            }


            .explore-link {

                font-size: 10px;

                height: 6%;
            }

        }
        /* ================================
   PHONE ROTATION SCREEN
================================ */

.rotate-screen {
    display: none;
}

@media (max-width: 600px) and (orientation: portrait) {

    body {
        overflow: hidden;
    }

    /* Hide the actual website only in portrait phone mode */
    .website {
        display: none !important;
    }

    .rotate-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        background: linear-gradient(135deg, #dff4ff, #fff4d6);
        z-index: 9999;
    }

    .rotate-icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: rotatePhone 2s ease-in-out infinite;
    }

    .rotate-screen h1 {
        color: #315b7d;
        font-size: clamp(25px, 7vw, 38px);
        margin-bottom: 12px;
        font-family: "Comic Sans MS", "Segoe Print", sans-serif;
    }

    .rotate-screen p {
        color: #527089;
        font-size: clamp(15px, 4vw, 20px);
        line-height: 1.5;
        max-width: 420px;
    }

    .rotate-tip {
        margin-top: 22px;
        padding: 10px 20px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.75);
        color: #7b6a3f;
        font-size: 14px;
        box-shadow: 0 5px 18px rgba(70, 100, 130, 0.12);
    }
}

@keyframes rotatePhone {
    0%, 100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(90deg);
    }
}

    </style>

</head>


<body>
    <div class="rotate-screen">
    <div class="rotate-icon">📱↔️</div>

    <h1>Please Rotate Your Phone</h1>

    </p>

    <div class="rotate-tip">
        🔎 Landscape mode gives you the full detective experience!
    </div>
</div>

    </div>


    <!-- =========================

    <a

    <div class="floating-star star-one">

</body>

</html>
