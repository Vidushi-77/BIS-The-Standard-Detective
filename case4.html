<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Case 4 - The Mystery Boxes</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #d8b88d;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}


/* ================= CASE PAGE ================= */

.case-page {
    position: relative;
    width: 100vw;
    aspect-ratio: 1536 / 1418;
    margin: 0 auto;

    background-image: url("case4.jpeg");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% 100%;

    overflow: hidden;
}


/* ================= NAVIGATION ================= */

.nav {
    position: absolute;
    top: 3.1%;
    right: 3.1%;

    display: flex;
    align-items: center;
    gap: 9px;

    z-index: 50;
}

.nav a {
    display: block;

    text-decoration: none;

    color: #173f75;

    font-size: clamp(11px, 1vw, 17px);
    font-weight: bold;

    padding: 8px 13px;

    background: rgba(255,255,255,0.96);

    border-radius: 22px;

    box-shadow: 0 3px 9px rgba(0,0,0,0.16);

    transition: 0.2s ease;
}

.nav a:hover {
    background: #e7f0fa;

    transform: translateY(-2px);
}


/* ================= INVISIBLE MYSTERY BUTTONS ================= */

.box-button {
    position: absolute;

    border: none;

    border-radius: 50%;

    background: transparent;

    cursor: pointer;

    z-index: 30;

    outline: none;

    color: transparent;

    -webkit-tap-highlight-color: transparent;
}

.box-button:hover {
    background: rgba(255,255,255,0.03);
}


/* BOX 1 */

.box1 {
    left: 5.5%;
    top: 36.8%;

    width: 20%;
    height: 17%;
}


/* BOX 2 */

.box2 {
    left: 29.5%;
    top: 36.8%;

    width: 20%;
    height: 17%;
}


/* BOX 3 */

.box3 {
    left: 53.5%;
    top: 36.8%;

    width: 20%;
    height: 17%;
}


/* BOX 4 */

.box4 {
    left: 76.5%;
    top: 36.8%;

    width: 19%;
    height: 17%;
}


/* ================= STARS ================= */

.stars {
    position: absolute;

    left: 50%;
    bottom: 5.2%;

    transform: translateX(-50%);

    display: flex;

    align-items: center;
    justify-content: center;

    gap: clamp(12px, 2vw, 28px);

    padding: 7px 22px;

    background: rgba(255,248,232,0.94);

    border-radius: 14px;

    box-shadow: 0 4px 10px rgba(60,35,15,0.18);

    z-index: 40;
}

.star {
    font-size: clamp(27px, 3vw, 46px);

    line-height: 1;

    color: transparent;

    -webkit-text-stroke: 2px #80501f;

    transition: 0.3s ease;
}

.star.solved {
    color: #f5bd29;

    -webkit-text-stroke: 1px #9b671b;

    transform: scale(1.12);
}


/* ================= PROGRESS TEXT ================= */

.progress {
    position: absolute;

    left: 50%;
    bottom: 1.7%;

    transform: translateX(-50%);

    color: #173f75;

    font-size: clamp(9px, 0.85vw, 14px);

    font-weight: bold;

    white-space: nowrap;

    z-index: 40;
}


/* ================= POPUP ================= */

.overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(20,35,55,0.62);

    z-index: 100;
}

.overlay.show {
    display: flex;
}

.popup {
    width: min(590px, 92vw);

    max-height: 90vh;

    overflow-y: auto;

    padding: 30px;

    text-align: center;

    background: #fff8e8;

    border: 5px solid #d59b4b;

    border-radius: 25px;

    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

.popup h2 {
    margin-bottom: 12px;

    color: #173f75;

    font-size: clamp(23px, 3vw, 35px);
}

.popup p {
    margin-bottom: 15px;

    color: #55473b;

    font-size: 16px;

    line-height: 1.5;
}

.question {
    margin: 15px 0;

    color: #173f75;

    font-size: 20px;

    font-weight: bold;
}


/* ================= ANSWERS ================= */

.answers {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;
}

.answer {
    border: none;

    padding: 11px 18px;

    border-radius: 22px;

    background: #e5b348;

    color: #173f75;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.answer:hover {
    transform: translateY(-3px);
}


/* ================= CLOSE BUTTON ================= */

.close {
    margin-top: 18px;

    border: none;

    padding: 10px 25px;

    border-radius: 22px;

    background: #173f75;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* ================= GO TO MARKS ================= */

.marks-button {
    display: inline-block;

    margin-top: 10px;

    padding: 13px 27px;

    border-radius: 25px;

    background: #e1a42d;

    color: white;

    text-decoration: none;

    font-weight: bold;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .nav {
        top: 2%;

        right: 2%;

        gap: 5px;
    }

    .nav a {
        padding: 5px 7px;

        font-size: 10px;
    }

    .stars {
        gap: 9px;

        padding: 5px 13px;
    }

    .progress {
        display: none;
    }
}
/* ================================
   PHONE ROTATION SCREEN
================================ */

.rotate-screen {
    display: none;
}

@media (max-width: 600px) and (orientation: portrait) {

    body {
        overflow: hidden;
    }

    /* Hide the actual website only in portrait phone mode */
    .website {
        display: none !important;
    }

    .rotate-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        background: linear-gradient(135deg, #dff4ff, #fff4d6);
        z-index: 9999;
    }

    .rotate-icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: rotatePhone 2s ease-in-out infinite;
    }

    .rotate-screen h1 {
        color: #315b7d;
        font-size: clamp(25px, 7vw, 38px);
        margin-bottom: 12px;
        font-family: "Comic Sans MS", "Segoe Print", sans-serif;
    }

    .rotate-screen p {
        color: #527089;
        font-size: clamp(15px, 4vw, 20px);
        line-height: 1.5;
        max-width: 420px;
    }

    .rotate-tip {
        margin-top: 22px;
        padding: 10px 20px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.75);
        color: #7b6a3f;
        font-size: 14px;
        box-shadow: 0 5px 18px rgba(70, 100, 130, 0.12);
    }
}

@keyframes rotatePhone {
    0%, 100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(90deg);
    }
}

</style>
</head>


<body>
    <div class="rotate-screen">
    <div class="rotate-icon">📱↔️</div>

    <h1>Please Rotate Your Phone</h1>

    <p>
        Turn your phone sideways to enter
        <strong>BIS: The Standard Detective</strong>.
    </p>

    <div class="rotate-tip">
        🔎 Landscape mode gives you the full detective experience!
    </div>
</div>


<div class="case-page">


    <!-- ================= NAVIGATION ================= -->

    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="cases.html">
            Cases
        </a>

        <a href="marks.html">
            Marks
        </a>

        <a href="quiz.html">
            Quiz
        </a>

        <a href="score.html">
            Score
        </a>

    </nav>


    <!-- ================= INVISIBLE BOX BUTTONS ================= -->

    <button
        class="box-button box1"
        aria-label="Open Mystery Box 1"
        onclick="openMystery(1)">
    </button>


    <button
        class="box-button box2"
        aria-label="Open Mystery Box 2"
        onclick="openMystery(2)">
    </button>


    <button
        class="box-button box3"
        aria-label="Open Mystery Box 3"
        onclick="openMystery(3)">
    </button>


    <button
        class="box-button box4"
        aria-label="Open Mystery Box 4"
        onclick="openMystery(4)">
    </button>


    <!-- ================= STARS ================= -->

    <div class="stars">

        <span
            class="star"
            id="star1">
            ☆
        </span>

        <span
            class="star"
            id="star2">
            ☆
        </span>

        <span
            class="star"
            id="star3">
            ☆
        </span>

        <span
            class="star"
            id="star4">
            ☆
        </span>

    </div>


    <div class="progress">
        Solve all four mysteries to complete the case!
    </div>


</div>



<!-- ================= POPUP ================= -->

<div
    class="overlay"
    id="overlay">


    <div class="popup">


        <h2 id="popupTitle"></h2>


        <p id="popupText"></p>


        <div
            class="question"
            id="popupQuestion">
        </div>


        <div
            class="answers"
            id="answers">
        </div>


        <button
            class="close"
            onclick="closePopup()">

            CLOSE

        </button>


    </div>

</div>



<script>


/* ================= MYSTERIES ================= */

const mysteries = {


    /* ================= MYSTERY 1 ================= */

    1: {

        title:
        "🔤 The Hidden Word",

        text:
        "Unscramble the letters to discover the BIS-related word.",

        question:
        "R A H L L M A K",

        options: [

            "HALLMARK",

            "STANDARD",

            "QUALITY MARK",

            "CERTIFICATION"

        ],

        correct:
        "HALLMARK"

    },


    /* ================= MYSTERY 2 ================= */

    2: {

        title:
        "📝 Complete the Clue",

        text:
        "Choose the word that correctly completes the clue.",

        question:
        "BIS develops ______ for quality and safety.",

        options: [

            "Standards",

            "Certification",

            "Hallmark",

            "Quality Mark"

        ],

        correct:
        "Standards"

    },


    /* ================= MYSTERY 3 ================= */

    3: {

        title:
        "🔎 Find the Symbol",

        text:
        "Which option is associated with BIS?",

        question:
        "Choose the correct answer.",

        options: [

            "BIS Standard Mark",

            "Hallmark",

            "ISI Mark",

            "Quality Mark"

        ],

        correct:
        "BIS Standard Mark"

    },


    /* ================= MYSTERY 4 ================= */

    4: {

        title:
        "🧠 The Final Riddle",

        text:
        "Think carefully, Detective!",

        question:
        "I help make products safe and reliable. What am I?",

        options: [

            "A Standard",

            "A Hallmark",

            "A Quality Mark",

            "A Certification"

        ],

        correct:
        "A Standard"

    }

};



/* ================= GAME VARIABLES ================= */

let solved = [

    false,

    false,

    false,

    false

];


let currentMystery = 0;



/* ================= OPEN MYSTERY ================= */

function openMystery(number) {


    currentMystery = number;


    const mystery =
        mysteries[number];


    document
        .getElementById("popupTitle")
        .textContent =
        mystery.title;


    document
        .getElementById("popupText")
        .textContent =
        mystery.text;


    document
        .getElementById("popupQuestion")
        .textContent =
        mystery.question;


    createAnswers(
        mystery.options
    );


    document
        .getElementById("overlay")
        .classList.add("show");

}



/* ================= CREATE ANSWERS ================= */

function createAnswers(options) {


    const area =
        document.getElementById("answers");


    area.innerHTML = "";


    options.forEach(
        function(option) {


            const button =
                document.createElement("button");


            button.className =
                "answer";


            button.textContent =
                option;


            button.onclick =
                function() {

                    checkAnswer(option);

                };


            area.appendChild(
                button
            );


        }
    );

}



/* ================= CHECK ANSWER ================= */

function checkAnswer(answer) {


    const mystery =
        mysteries[currentMystery];


    if (
        answer === mystery.correct
    ) {


        solved[
            currentMystery - 1
        ] = true;


        document
            .getElementById(
                "star" + currentMystery
            )
            .classList.add(
                "solved"
            );


        document
            .getElementById(
                "popupTitle"
            )
            .textContent =
            "✨ Fabulous, Detective!";


        document
            .getElementById(
                "popupText"
            )
            .textContent =
            "You solved this mystery and unlocked a star!";


        document
            .getElementById(
                "popupQuestion"
            )
            .textContent =
            "⭐ Mystery solved!";


        document
            .getElementById(
                "answers"
            )
            .innerHTML = "";


        if (
            solved.every(Boolean)
        ) {


            setTimeout(
                showFinal,
                700
            );

        }


    }

    else {


        document
            .getElementById(
                "popupTitle"
            )
            .textContent =
            "🔍 Keep Looking, Detective!";


        document
            .getElementById(
                "popupText"
            )
            .textContent =
            "That's not the correct answer. Think carefully and try again!";


        document
            .getElementById(
                "popupQuestion"
            )
            .textContent =
            "Try again!";


        createAnswers(
            mystery.options
        );

    }

}



/* ================= FINAL SCREEN ================= */

function showFinal() {


    document
        .getElementById(
            "popupTitle"
        )
        .textContent =
        "🎉 CASE SOLVED, DETECTIVE!";


    document
        .getElementById(
            "popupText"
        )
        .textContent =
        "You unlocked all four mysteries and completed the final case!";


    document
        .getElementById(
            "popupQuestion"
        )
        .textContent =
        "⭐⭐⭐⭐  4 / 4 MYSTERIES SOLVED!";


    document
        .getElementById(
            "answers"
        )
        .innerHTML = `

            <a
                href="marks.html"
                class="marks-button">

                GO TO MARKS →

            </a>

        `;

}



/* ================= CLOSE POPUP ================= */

function closePopup() {


    document
        .getElementById(
            "overlay"
        )
        .classList.remove(
            "show"
        );

}

</script>


</body>
</html>
